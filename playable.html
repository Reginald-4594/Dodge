<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>DODGE - Playable</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a0f;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:none}
  #game{display:block;width:100vw;height:100vh}
  #ui{position:fixed;top:0;left:0;width:100%;padding:20px;display:flex;justify-content:space-between;pointer-events:none}
  #score{font-size:28px;font-weight:800;letter-spacing:-1px}
  #best{opacity:.5;font-size:14px}
  #center{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
  h1{font-size:64px;font-weight:900;letter-spacing:-4px;line-height:.9}
  h1 span{color:#6dff8f}
  p{margin:16px 0;opacity:.6;max-width:280px;line-height:1.4}
  button{pointer-events:auto;background:#6dff8f;color:#000;border:0;padding:16px 32px;border-radius:100px;font-weight:800;font-size:18px;cursor:pointer;transform:scale(1);transition:.15s}
  button:active{transform:scale(.95)}
  #hint{position:fixed;bottom:24px;width:100%;text-align:center;opacity:.35;font-size:13px;pointer-events:none}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui"><div id="score">0</div><div id="best">BEST 0</div></div>
<div id="center">
  <h1>DODGE<span>.</span></h1>
  <p>Drag to move. Don't touch red.<br>Hold longer = faster.</p>
  <button id="playBtn">TAP TO PLAY</button>
</div>
<div id="hint">made as a single file — host it anywhere</div>

<script>
const c = document.getElementById('game');
const ctx = c.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const centerEl = document.getElementById('center');
const btn = document.getElementById('playBtn');

let W,H, player, enemies, particles, score, best, running, lastTime;
let inputX = 0, inputY = 0, targetX = 0, targetY = 0;

function resize(){
  W = c.width = window.innerWidth * devicePixelRatio;
  H = c.height = window.innerHeight * devicePixelRatio;
  c.style.width = window.innerWidth+'px';
  c.style.height = window.innerHeight+'px';
}
window.addEventListener('resize', resize);
resize();

best = +localStorage.getItem('dodge-best') || 0;
bestEl.textContent = 'BEST '+best;

function reset(){
  player = {x:W/2, y:H*0.7, r:14*devicePixelRatio, vx:0, vy:0};
  enemies = [];
  particles = [];
  score = 0;
  targetX = player.x;
  targetY = player.y;
}

function spawn(){
  const side = Math.random()<0.5 ? 0 : W;
  const y = Math.random()*H*0.5;
  enemies.push({
    x: side, y: y,
    r: (12+Math.random()*18)*devicePixelRatio,
    vx: (Math.random()*2+1)*(side===0?1:-1)*devicePixelRatio,
    vy: Math.random()*1.5*devicePixelRatio,
    hue: 0
  });
}

function loop(t){
  if(!running) return;
  const dt = Math.min(32, t-lastTime)/16;
  lastTime = t;

  // difficulty
  if(Math.random() < 0.04 + score*0.0005) spawn();

  // move player smooth
  player.vx += (targetX - player.x)*0.15;
  player.vy += (targetY - player.y)*0.15;
  player.vx *= 0.85; player.vy *= 0.85;
  player.x += player.vx * dt;
  player.y += player.vy * dt;
  player.x = Math.max(player.r, Math.min(W-player.r, player.x));
  player.y = Math.max(player.r, Math.min(H-player.r, player.y));

  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0,0,W,H);

  // trail grid
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  for(let x=0;x<W;x+=60*devicePixelRatio){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=60*devicePixelRatio){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  // enemies
  for(let i=enemies.length-1;i>=0;i--){
    const e = enemies[i];
    e.x += e.vx*dt*(1+score*0.002);
    e.y += e.vy*dt*(1+score*0.002);
    e.vx += Math.sin(t*0.001+e.y)*0.02*dt;

    if(e.y > H+100 || e.x < -100 || e.x > W+100) enemies.splice(i,1);

    // collision
    const dx = e.x-player.x, dy = e.y-player.y;
    if(Math.hypot(dx,dy) < e.r+player.r){
      gameOver();
      return;
    }

    ctx.beginPath();
    ctx.arc(e.x,e.y,e.r,0,Math.PI*2);
    ctx.fillStyle = '#ff3b4a';
    ctx.shadowColor = '#ff3b4a';
    ctx.shadowBlur = 20*devicePixelRatio;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // player
  ctx.beginPath();
  ctx.arc(player.x,player.y,player.r,0,Math.PI*2);
  ctx.fillStyle = '#6dff8f';
  ctx.shadowColor = '#6dff8f';
  ctx.shadowBlur = 25*devicePixelRatio;
  ctx.fill();
  ctx.shadowBlur = 0;

  // particles
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.x+=p.vx; p.y+=p.vy; p.life-=0.02*dt;
    if(p.life<=0) particles.splice(i,1);
    else{
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x,p.y,3*devicePixelRatio,3*devicePixelRatio);
      ctx.globalAlpha = 1;
    }
  }

  score += dt*0.8;
  scoreEl.textContent = Math.floor(score);
  requestAnimationFrame(loop);
}

function gameOver(){
  running = false;
  if(Math.floor(score) > best){
    best = Math.floor(score);
    localStorage.setItem('dodge-best', best);
    bestEl.textContent = 'BEST '+best;
  }
  centerEl.style.display = 'flex';
  btn.textContent = 'RETRY • '+Math.floor(score);
}

function start(){
  reset();
  centerEl.style.display = 'none';
  running = true;
  lastTime = performance.now();
  requestAnimationFrame(loop);
}

function setInput(clientX, clientY){
  const rect = c.getBoundingClientRect();
  targetX = (clientX - rect.left) * devicePixelRatio;
  targetY = (clientY - rect.top) * devicePixelRatio;
}

btn.addEventListener('click', start);
c.addEventListener('touchstart', e=>{setInput(e.touches[0].clientX,e.touches[0].clientY); if(!running) start();},{passive:true});
c.addEventListener('touchmove', e=>{setInput(e.touches[0].clientX,e.touches[0].clientY); e.preventDefault();},{passive:false});
c.addEventListener('mousemove', e=>{setInput(e.clientX,e.clientY);});
c.addEventListener('mousedown', e=>{setInput(e.clientX,e.clientY); if(!running) start();});

reset();
</script>
</body>
</html>
